workflows:
  ios-app-store:
    name: Drone Drop iOS (App Store)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      # Codemagic > Teams > Integrations > App Store Connect: add an API key and name it "Codemagic"
      app_store_connect: Codemagic
    environment:
      groups:
        # Codemagic > App > Environment variables: group "drone_drop" with APP_STORE_APPLE_ID
        # (the numeric Apple ID shown in App Store Connect > App Information)
        # and CERT_KEY_BASE64 (Secure): the RSA private key as one line of base64 text
        - drone_drop
      vars:
        BUNDLE_ID: "com.kenkwan22.dronedrop"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 20
      xcode: latest
      cocoapods: default
    triggering:
      events: []   # run manually from the Codemagic UI
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Check RevenueCat key is a real iOS key
        script: |
          grep -q "iosKey: 'appl_" index.html || { echo "iosKey in index.html must start with appl_ (never ship a test_ key)"; exit 1; }
      - name: Copy web game into iOS project
        script: npm run sync
      - name: Install Pods
        script: cd ios/App && pod install
      - name: Prepare signing key
        script: |
          [ -n "$CERT_KEY_BASE64" ] || { echo "CERT_KEY_BASE64 is missing: add it as a Secure variable in the drone_drop group"; exit 1; }
          echo "$CERT_KEY_BASE64" | tr -d ' \r\n' | base64 --decode > "$HOME/codemagic_key.pem"
          openssl rsa -in "$HOME/codemagic_key.pem" -noout -check || { echo "CERT_KEY_BASE64 is not a valid RSA private key: make it again from the Mac Terminal"; exit 1; }
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE --create \
            --certificate-key @file:$HOME/codemagic_key.pem
          keychain add-certificates
          xcode-project use-profiles --project ios/App/App.xcodeproj
      - name: Set build number
        script: |
          LATEST=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          cd ios/App
          agvtool new-version -all $((LATEST + 1))
      - name: Build ipa
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Submission for App Review is done by hand in App Store Connect after TestFlight testing.
