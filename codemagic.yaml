workflows:
  ios-app-store:
    name: Drone Drop iOS (App Store)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      # Codemagic > Teams > Integrations > App Store Connect: add an API key and name it "Codemagic"
      app_store_connect: Codemagic
    environment:
      groups:
        # Codemagic > App > Environment variables: group "drone_drop" with APP_STORE_APPLE_ID
        # (the numeric Apple ID shown in App Store Connect > App Information)
        - drone_drop
      vars:
        BUNDLE_ID: "com.kenkwan22.dronedrop"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.kenkwan22.dronedrop
      node: 20
      xcode: latest
      cocoapods: default
    triggering:
      events: []   # run manually from the Codemagic UI
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Check RevenueCat key is a real iOS key
        script: |
          grep -q "iosKey: 'appl_" index.html || { echo "iosKey in index.html must start with appl_ (never ship a test_ key)"; exit 1; }
      - name: Copy web game into iOS project
        script: npm run sync
      - name: Install Pods
        script: cd ios/App && pod install
      - name: Apply code signing to the Xcode project
        script: xcode-project use-profiles
      - name: Set build number
        script: |
          LATEST=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          cd ios/App
          agvtool new-version -all $((LATEST + 1))
      - name: Build ipa
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        # The build uploads to App Store Connect and shows in TestFlight for internal testers. Submission for App Review is done by hand.
